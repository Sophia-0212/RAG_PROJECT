name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile source
        run: python -m compileall -q agent documents evaluation graph graph2 llm_models rag_service tools utils main.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify environment and package metadata
        run: |
          python -m pip check
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/rag-wheel .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependency graph
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --strict --requirement requirements.lock
          pip-audit --strict --requirement requirements.service.lock
      - name: Generate CycloneDX SBOM
        run: |
          pip-audit --requirement requirements.lock --format cyclonedx-json --output python-full-sbom.json
          pip-audit --requirement requirements.service.lock --format cyclonedx-json --output python-service-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-sboms
          path: python-*-sbom.json

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --tag rag-enterprise-service:${{ github.sha }} .
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rag-enterprise-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
