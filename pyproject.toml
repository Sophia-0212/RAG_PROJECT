[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-service"
version = "0.1.0"
description = "CRM enterprise RAG core service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "langchain==1.3.17",
  "langchain-classic==1.0.8",
  "langchain-community==0.4.2",
  "langchain-core==1.6.0",
  "langchain-experimental==0.4.2",
  "langchain-huggingface==1.2.2",
  "langchain-milvus==0.4.0",
  "langchain-openai==1.6.0",
  "langfuse==4.15.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "loguru==0.7.3",
  "pydantic==2.13.4",
  "prometheus-client==0.26.0",
  "pymilvus==3.0.1",
  "python-dotenv==1.2.3",
  "sentence-transformers==6.0.0",
  "tiktoken==0.14.0",
  "unstructured[md]==0.27.1",
  "uvicorn==0.52.4",
]

[project.scripts]
rag-cli = "rag_service.cli:main"
rag-eval-gate = "evaluation.cli:main"
rag-ingest = "documents.ingest_markdown:main"
rag-api = "rag_service.api_cli:main"
rag-migrate = "rag_service.migrations:main"

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["agent*", "documents*", "evaluation*", "graph*", "graph2*", "llm_models*", "rag_service*", "tools*", "utils*"]

[tool.setuptools.package-data]
evaluation = ["datasets/*.jsonl", "*.json"]
