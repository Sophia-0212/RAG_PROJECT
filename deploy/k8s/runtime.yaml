apiVersion: v1
kind: Namespace
metadata:
  name: rag-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service
  namespace: rag-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-service-config
  namespace: rag-system
data:
  RAG_ENV: production
  RAG_STATE_BACKEND: postgres
  RAG_DB_POOL_MIN_SIZE: "1"
  RAG_DB_POOL_MAX_SIZE: "16"
  RAG_DB_POOL_TIMEOUT_SECONDS: "5"
  RAG_REDIS_SOCKET_TIMEOUT_SECONDS: "1"
  RAG_CONVERSATION_LOCK_TTL_SECONDS: "45"
  RAG_CONVERSATION_LOCK_ACQUIRE_TIMEOUT_SECONDS: "0.25"
  RAG_MAX_CONCURRENT_REQUESTS: "12"
  RAG_REQUEST_TIMEOUT_SECONDS: "30"
  RAG_GRAPH_VERSION: graph2-bounded-v1
  RAG_INPUT_SCHEMA_VERSION: "1"
  RAG_RECOVERY_ENABLED: "true"
  RAG_RECOVERY_MAX_ATTEMPTS: "3"
  RAG_RECOVERY_WINDOW_SECONDS: "300"
  RAG_RUN_LEASE_SECONDS: "45"
  RAG_RUN_HEARTBEAT_SECONDS: "10"
  RAG_RECOVERY_POLL_SECONDS: "1"
  RAG_RECOVERY_CONCURRENCY: "2"
  RAG_RECOVERY_AUTHORIZATION_URL: https://iam.internal/v1/rag/recovery-authorize
  RAG_TENANT_REQUEST_BURST: "20"
  RAG_TENANT_REQUESTS_PER_MINUTE: "60"
  HF_HUB_OFFLINE: "true"
  HF_HOME: /models
  LANGGRAPH_STRICT_MSGPACK: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: rag-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-service
    spec:
      serviceAccountName: rag-service
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rag-service
      containers:
        - name: rag-service
          image: rag-enterprise-service:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "rag_service.api_cli", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          envFrom:
            - configMapRef:
                name: rag-service-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: openai-api-key
            - name: RAG_GATEWAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: gateway-shared-secret
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: database-url
            - name: RAG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: redis-url
            - name: RAG_RECOVERY_AUTHORIZATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: recovery-authorization-token
            - name: MILVUS_URI
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: milvus-uri
            - name: RAG_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: llm-base-url
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: model-cache
          persistentVolumeClaim:
            claimName: rag-model-cache
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: rag-system
spec:
  selector:
    app.kubernetes.io/name: rag-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-service
  namespace: rag-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-recovery-worker
  namespace: rag-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-recovery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-recovery-worker
    spec:
      serviceAccountName: rag-service
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recovery-worker
          image: rag-enterprise-service:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "rag_service.recovery_worker"]
          envFrom:
            - configMapRef:
                name: rag-service-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: openai-api-key
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: database-url
            - name: RAG_DB_POOL_MAX_SIZE
              value: "4"
            - name: RAG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: redis-url
            - name: MILVUS_URI
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: milvus-uri
            - name: RAG_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: llm-base-url
            - name: RAG_RECOVERY_AUTHORIZATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: recovery-authorization-token
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["python", "-m", "rag_service.recovery_worker", "--check"]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: model-cache
          persistentVolumeClaim:
            claimName: rag-model-cache
            readOnly: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-recovery-worker
  namespace: rag-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-recovery-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-service
  namespace: rag-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-service
  minReplicas: 3
  maxReplicas: 9
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
