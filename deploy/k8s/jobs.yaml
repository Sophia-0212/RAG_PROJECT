apiVersion: batch/v1
kind: Job
metadata:
  name: rag-state-schema-migration
  namespace: rag-system
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-state-schema-migration
    spec:
      restartPolicy: Never
      serviceAccountName: rag-service
      containers:
        - name: migrate
          image: rag-enterprise-service:0.1.0
          args: ["python", "-m", "rag_service.migrations", "schema"]
          env:
            - name: RAG_STATE_BACKEND
              value: postgres
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-service-secrets
                  key: database-url
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-expired-state-pruner
  namespace: rag-system
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rag-expired-state-pruner
        spec:
          restartPolicy: Never
          serviceAccountName: rag-service
          containers:
            - name: prune
              image: rag-enterprise-service:0.1.0
              args: ["python", "-m", "rag_service.migrations", "prune"]
              envFrom:
                - configMapRef:
                    name: rag-service-config
              env:
                - name: RAG_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: rag-service-secrets
                      key: database-url
                - name: RAG_REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: rag-service-secrets
                      key: redis-url
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
